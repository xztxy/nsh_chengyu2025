version: '3.8'

# 定义网络
networks:
  nsh-chengyu-network:
    driver: bridge
    name: nsh-chengyu-network

# 定义卷
volumes:
  nsh-chengyu-db:
    name: nsh-chengyu-db

# 定义服务
services:
  nsh-chengyu:
    # 使用Docker Hub镜像
    image: mdespot/nsh-chengyu:latest
    # 端口映射
    ports:
      - "8666:8666"
    # 环境变量
    environment:
      - FLASK_ENV=production
      - PORT=8666
      - SECRET_KEY=${SECRET_KEY:-default_secret_key}
      - SECRET_PASSWORD=${SECRET_PASSWORD:-lsz20100}
      - DB_PATH=idioms.db
    # 拉取策略
    pull_policy: if_not_present
    # 网络配置
    networks:
      - nsh-chengyu-network
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8666/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # 数据卷
    volumes:
      - nsh-chengyu-db:/app
    # 重启策略
    restart: unless-stopped
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"